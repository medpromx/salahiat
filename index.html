<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آزمون صلاحیت روان‌شناسی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2a2e; --muted:#6b7378; --line:#e2dccf;
  --accent:#0f5c63; --accent-soft:#e3efef; --gold:#b08530; --gold-soft:#f6eedb;
  --ok:#2f7d4f; --ok-soft:#e5f3ea; --bad:#b23b3b; --bad-soft:#f8e6e4; --skip:#8a7a52;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(31,42,46,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a1c; --card:#1d2427; --ink:#e7e4dc; --muted:#9aa3a7; --line:#2f383c;
  --accent:#5fb3b9; --accent-soft:#1f3436; --gold:#d6ad5c; --gold-soft:#2f2a1e;
  --ok:#6cc38f; --ok-soft:#1d3226; --bad:#e57b7b; --bad-soft:#3a2222; --skip:#c2ae7d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);}}
:root[data-theme="dark"]{
  --bg:#151a1c; --card:#1d2427; --ink:#e7e4dc; --muted:#9aa3a7; --line:#2f383c;
  --accent:#5fb3b9; --accent-soft:#1f3436; --gold:#d6ad5c; --gold-soft:#2f2a1e;
  --ok:#6cc38f; --ok-soft:#1d3226; --bad:#e57b7b; --bad-soft:#3a2222; --skip:#c2ae7d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 110px}
.katex{direction:ltr;unicode-bidi:isolate;font-size:1.02em}
.katex-display{direction:ltr;overflow-x:auto;overflow-y:hidden;padding:4px 0}
code{direction:ltr;unicode-bidi:isolate;background:var(--accent-soft);padding:0 5px;border-radius:4px;font-size:.9em}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-block-end:14px}
.brand{font-weight:800;font-size:15px;color:var(--accent)}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-block-end:18px}
.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.counter{font-size:13px;color:var(--muted);white-space:nowrap}

/* question card */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 22px 18px}
.subject{display:inline-block;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:13px;padding:3px 12px;border-radius:99px;margin-block-end:10px}
.qnum{font-weight:800;font-size:20px;color:var(--accent);margin-block-end:6px}
.qtext{font-size:17px;font-weight:500;text-align:justify;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:start;width:100%;background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:15.5px;line-height:1.8;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:14px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:#fff}
.clear{margin-block-start:12px;background:none;border:0;color:var(--muted);font-size:13px;padding:4px 0}
.clear:hover{color:var(--bad)}

/* bottom nav */
.nav{position:fixed;inset-inline:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:5}
.nav .in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;justify-content:space-between;align-items:center}
.nbtn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:84px;background:none;border:1px solid var(--line);border-radius:12px;padding:6px 14px;color:var(--ink);font-size:12.5px;font-weight:500}
.nbtn svg{width:22px;height:22px}
.nbtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.nbtn:disabled{opacity:.35;cursor:default}
.nbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.nbtn.primary:hover{filter:brightness(1.08);color:#fff}
.nbtn.finish{background:var(--gold);border-color:var(--gold);color:#fff}

/* grid modal */
.modal{position:fixed;inset:0;background:rgba(10,15,17,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.open{display:flex}
.sheet{background:var(--card);border-radius:16px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:20px;box-shadow:var(--shadow)}
.sheet h3{margin:0 0 4px;font-size:17px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-block-end:12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle;background:var(--c)}
.grp{font-size:13px;font-weight:700;color:var(--gold);margin:14px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.cell{height:40px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:700;font-size:14px}
.cell.done{background:var(--accent);border-color:var(--accent);color:#fff}
.cell.cur{outline:2px solid var(--gold);outline-offset:1px}
.sheet .row{display:flex;gap:10px;justify-content:space-between;margin-block-start:16px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:8px 16px;font-size:14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}

/* results */
.hero{text-align:center;padding:26px 20px}
.score{font-size:46px;font-weight:800;color:var(--accent);line-height:1.2}
.score small{font-size:18px;color:var(--muted);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-block-start:16px}
.stat{border-radius:12px;padding:10px;background:var(--c2)}
.stat b{display:block;font-size:22px;color:var(--c)}
.stat span{font-size:12.5px;color:var(--muted)}
.verdict{margin-block-start:14px;font-size:14.5px;color:var(--muted)}
h2.sec{font-size:17px;margin:26px 0 10px;color:var(--accent)}
.bars{display:grid;gap:10px}
.bar .lbl{display:flex;justify-content:space-between;font-size:14px;gap:10px}
.bar .lbl em{font-style:normal;color:var(--muted);white-space:nowrap}
.bar .tr{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin-block-start:4px}
.bar .tr i{display:block;height:100%;border-radius:99px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.fbtn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;font-size:13.5px;color:var(--ink)}
.fbtn.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.rv{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--st);border-radius:14px;padding:16px 18px;margin-block-end:12px}
.rv .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-block-end:6px}
.rv .hd b{color:var(--accent)}
.tag{font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--st2);color:var(--st)}
.rv .q{font-weight:500;text-align:justify;margin:4px 0 10px}
.rv ul.ro{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:6px}
.rv ul.ro li{border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14.5px}
.rv ul.ro li.right{border-color:var(--ok);background:var(--ok-soft)}
.rv ul.ro li.wrong{border-color:var(--bad);background:var(--bad-soft)}
.rv ul.ro li .m{font-size:12px;font-weight:700;margin-inline-start:6px}
.rv ul.ro li.right .m{color:var(--ok)} .rv ul.ro li.wrong .m{color:var(--bad)}
details.ex{background:var(--gold-soft);border-radius:10px;padding:8px 14px}
details.ex summary{cursor:pointer;font-weight:700;color:var(--gold);font-size:14px}
details.ex .body{font-size:14.5px;text-align:justify}
details.ex ul{padding-inline-start:20px;margin:6px 0}
details.ex ol{padding-inline-start:22px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-block-start:18px}
.hidden{display:none!important}
@media (max-width:520px){
  .card{padding:16px}
  .qtext{font-size:16px}
  .nbtn{min-width:0;flex:1;padding:6px 6px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .score{font-size:38px}
}
@media print{.nav,.actions,.filters,.top .tools{display:none!important} details.ex{display:block} .rv{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">آزمون شبیه‌ساز صلاحیت حرفه‌ای<small>روان‌شناسی و مشاوره — ۱۲۰ سؤال</small></div>
    <div class="counter" id="counter"></div>
  </div>
  <div class="progress"><i id="prog"></i></div>

  <section id="quiz">
    <article class="card">
      <div class="subject" id="subject"></div>
      <div class="qnum" id="qnum"></div>
      <p class="qtext" id="qtext"></p>
      <div class="opts" id="opts"></div>
      <button class="clear hidden" id="clear">پاک کردن پاسخ</button>
    </article>
  </section>

  <section id="results" class="hidden"></section>
</div>

<nav class="nav" id="nav"><div class="in">
  <button class="nbtn" id="prev" aria-label="سؤال قبلی">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>قبلی</button>
  <button class="nbtn" id="pick" aria-label="انتخاب سؤال">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>انتخاب سؤال</button>
  <button class="nbtn primary" id="next" aria-label="سؤال بعدی">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg><span id="nextLbl">بعدی</span></button>
</div></nav>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <h3>انتخاب سؤال</h3>
    <div class="legend"><span style="--c:var(--accent)">پاسخ داده‌شده</span><span style="--c:var(--line)">بی‌پاسخ</span><span style="--c:var(--gold)">سؤال فعلی</span></div>
    <div id="gridWrap"></div>
    <div class="row">
      <button class="btn" id="closeM">بستن</button>
      <button class="btn gold" id="finishM">پایان آزمون و پاسخ‌نامه</button>
    </div>
  </div>
</div>

<script>
const Q = [{"n": 1, "section": "اخلاق حرفه‌ای، قوانین و حدود صلاحیت", "booklet": "دفترچه اول", "q": "مراجعی ۲۸ ساله با تشخیص اختلال شخصیت مرزی و سابقه یک بار اقدام به خودکشی در دو سال قبل، در پایان جلسه درمان می‌گوید: «احساس می‌کنم دیگر طاقت این درد را ندارم و شاید امشب با قرص‌هایی که در خانه جمع کرده‌ام به همه‌چیز پایان دهم، اما به شما قول می‌دهم کاری نکنم؛ لطفاً به خانواده‌ام چیزی نگویید چون آبرویم می‌رود.» بر اساس نظام‌نامه اخلاقی و پروتکل مدیریت بحران، دقیق‌ترین اقدام درمانگر در این لحظه چیست؟", "opts": [["الف", "به دلیل اخذ پیمان ایمنی شفاهی و اهمیت حفظ اتحاد درمانی در بیماران مرزی، رازداری حفظ شود و جلسه بعد برای فردا تنظیم گردد."], ["ب", "بدون اطلاع مراجع، بلافاصله پس از خروج او از کلینیک با اورژانس اجتماعی و خانواده تماس گرفته شود و تمام جزئیات پرونده درمانی برای آن‌ها ارسال گردد."], ["ج", "خطر خودکشی جدی و قریب‌الوقوع تلقی شده، ضمن اعلام شفاف به مراجع درباره محدودیت رازداری در خطر جانی، با رعایت اصل حداقل افشای ضروری، خانواده یا اورژانس در جریان قرار گیرند و مداخله حفاظتی انجام شود."], ["د", "از مراجع تعهد کتبی مبنی بر عدم خودکشی گرفته شود و در صورت امضای فرم، مسئولیت قانونی و اخلاقی از درمانگر سلب می‌گردد."]], "ans": "ج", "exp": "<ul>\n<li><strong>تحلیل سناریو و گزینه صحیح:<\/strong> وجود سابقه اقدام قبلی + بیان قصد مشخص برای امشب + دسترسی به ابزار کشنده (قرص‌های جمع‌آوری‌شده) نشان‌دهنده <strong>خطر حاد و قریب‌الوقوع<\/strong> است. در این شرایط، اصل «حفظ حیات و عدم اضرار» بر «رازداری» مقدم است. درمانگر باید با رعایت <strong>اصل حداقل افشای ضروری<\/strong> (فقط اطلاعات مربوط به خطر فعلی، نه کل پرونده)، خانواده یا مراجع ذی‌صلاح را مطلع سازد.<\/li>\n<li><strong>تله آزمونی (B40):<\/strong> پیمان عدم خودکشی (شفاهی یا کتبی در گزینه‌های الف و د) در حضور خطر حاد و ابزار در دسترس، به هیچ وجه جایگزین مداخله حفاظتی نمی‌شود و رافع مسئولیت قانونی درمانگر نیست. گزینه (ب) به دلیل افشای «تمام جزئیات پرونده» نقض اصل حداقل افشا است.<\/li>\n<\/ul>"}, {"n": 2, "section": "اخلاق حرفه‌ای، قوانین و حدود صلاحیت", "booklet": "دفترچه اول", "q": "در جریان جلسات مشاوره فردی، مردی ۳۵ ل «عدم آسیب‌رسانی» و «صلاحیت حرفه‌ای»، وظیفه اخلاقی او چیست؟", "opts": [["الف", "ادامه جلسات با افزایش تعداد مراجعان برای پرت شدن حواس خود از موضوع سوگ."], ["ب", "در میان گذاشتن جزئیات سوگ شخصی خود با مراجعان جهت دریافت همدلی از آنان."], ["ج", "خودپایی (Self-monitoring)، کاهش یا توقف موقت فعالیت بالینی، ارجاع مسئولانه مراجعان حساس به همکار واجد شرایط و دریافت روان‌درمانی و سوپرویژن شخصی."], ["د", "تجویز داروی آرام‌بخش برای خود و ادامه عادی جلسات بدون اطلاع سوپروایزر."]], "ans": "ج", "exp": "<ul>\n<li><strong>تحلیل سناریو و گزینه صحیح:<\/strong> بر اساس نظام‌نامه اخلاقی و مبحث «درمانگر آسیب‌دیده / فرسوده (Impaired Professional)» در کتاب کوری و گلدارد، هنگامی که مسائل شخصی، بحران‌های عاطفی یا بیماری درمانگر بر کیفیت قضاوت بالینی و کارآمدی او اثر منفی می‌گذارد، او موظف است فعالیت خود را محدود یا متوقف کرده و مراجعان را ارجاع دهد. گزینه (ب) مصداق <strong>خودافشایی آسیب‌زا و معکوس شدن نقش‌ها<\/strong> است.<\/li>\n<\/ul>"}, {"n": 9, "section": "اخلاق حرفه‌ای، قوانین و حدود صلاحیت", "booklet": "دفترچه اول", "q": "در اولین جلسه زوج‌درمانی، درمانگر به زوج اعلام می‌کند که در طول درمان، یک جلسه فردی نیز با هر کدام برگزار خواهد کرد. در جلسه فردی، شوهر فاش می‌کند که در حال حاضر در یک رابطه فرازناشویی فعال قرار دارد و قصد ادامه آن را دارد، اما اکیداً از درمانگر می‌خواهد که این راز را به همسرش نگوید. بهترین سیاست حرفه‌ای درمانگر برای مدیریت این معضل چیست؟", "opts": [["الف", "درمانگر باید در ابتدای جلسه اول زوج‌درمانی، سیاست مکتوب خود درباره «عدم نگهداری اسرار پنهان (No-Secret Policy)» یا حدود رازداری در جلسات فردی را در قالب رضایت آگاهانه مشخص می‌کرد؛ اکنون باید شوهر را به افشا یا قطع رابطه ترغیب کند و در صورت امتناع و تعارض با اهداف زوج‌درمانی، ادامه زوج‌درمانی را متوقف و به درمان فردی ارجاع دهد."], ["ب", "درمانگر باید در شروع جلسه مشترک بعدی، بلافاصله راز شوهر را در حضور همسرش فاش کند."], ["ج", "درمانگر باید تا پایان ۲۰ جلسه زوج‌درمانی این راز را پنهان نگه دارد و روی مهارت‌های ارتباطی زوج کار کند."], ["د", "درمانگر باید با فرد سوم (شریک رابطه فرازناشویی) تماس بگیرد و او را تهدید  "اختلال روان‌پریشی کوتاه‌مدت (Brief Psychotic Disorder)"], ["ب", "اختلال اسکیزوفرنی‌فرم (Schizophreniform Disorder) با ویژگی‌های پیش‌آگهی خوب"], ["ج", "اسکیزوفرنی (Schizophrenia)"], ["د", "اختلال اسکیزوافکتیو (Schizoaffective Disorder)"]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل آستانه زمانی (B08):<\/strong> طیف زمانی اختلالات روان‌پریشی در DSM-5-TR به شرح زیر است:<ul>\n<li><strong>روان‌پریشی کوتاه‌مدت (الف):<\/strong> حداقل <strong>۱ روز<\/strong> و کمتر از <strong>۱ ماه<\/strong> (با بازگشت کامل به عملکرد قبلی).<\/li>\n<li><strong>اسکیزوفرنی‌فرم (ب):<\/strong> حداقل <strong>۱ ماه<\/strong> و کمتر از <strong>۶ ماه<\/strong> (در این سناریو کل دوره ۳ تا ۴ ماه طول کشیده است؛ شروع سریع، وجود عامل استرس‌زای آشکارساز و سردرگمی در اوج بیماری نیز از ویژگی‌های پیش‌آگهی خوب آن است).<\/li>\n<li><strong>اسکیزوفرنی (ج):<\/strong> تداوم علائم برای حداقل <strong>۶ ماه<\/strong> (شامل حداقل ۱ ماه علائم فاز فعال).<\/li>\n<\/ul>\n<\/li>\n<\/ul>"}, {"n": 32, "section": "آسیب‌شناسی روانی و تشخیص بالینی بر اساس DSM-5-TR", "booklet": "دفترچه سوم", "q": "مراجعی به مدت ۶ ماه است که علائم فعال اسکیزوفرنی (توهم شنوایی و هذیان کنترل) را نشان می‌دهد. در بررسی تاریخچه مشخص می‌شود که او در طول این ۶ ماه، به مدت ۴ ماه کامل واجد ملاک‌های اپیزود افسردگی اساسی نیز بوده است، اما به مدت ۲ ماه نیز هذیان و توهم را بدون هیچ‌گونه علامت خلقی افسردگی یا مانیا تجربه کرده است. تشخیص صحیح کدام است؟", "opts": [["الف", "اختلال افسردگی اساسی با ویژگی‌های روان‌پریشانه"], ["ب", "اختلال اسکیزوافکتیو، نوع افسردگی"], ["ج", "اختلال شخصیت اسکیزوتایپال"], ["د", "اختلال دوقطبی نوع یک"]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل افتراقی طلایی (B08 / B10):<\/strong> در <strong>اختلال اسکیزوافکتیو<\/strong> دو شرط کلیدی باید هم‌زمان برقرار باشد: ۱. ملاک B: وجود <strong>حداقل ۲ هفته هذیان یا توهم در غیاب کامل اپیزود خلقی عمده<\/strong> (که در این بیمار ۲ ماه وجود داشته و «اختلال افسردگی با ویژگی‌های روان‌پریشانه» را رد می‌کند، چون در افسردگی روان‌پریشانه، هذیان و توهم منحصراً در درون اپیزود افسردگی رخ می‌دهند)؛ ۲. ملاک C: علائم اپیزود خلقی عمده در <strong>بخش عمده‌ای (اکثریت زمان)<\/strong> از کل دوره بیماری فعال و باقیمانده حضور داشته باشد (۴ ماه از ۶ ماه).<\/li>\n<\/ul>"}, {"n": 33, "section": "آسیب‌شناسی روانی و تشخیص بالینی بر اساس DSM-5-TR", "booklet": "دفترچه سوم", "q": "زنی ۳۰ ساله به مدت ۵ روز متوالی دچار خلق بالا، کاهش نیاز به خواب (۳ ساعت در شبانه‌روز بدون احساس خستگی)، پرحرفی و افزایش فعالیت‌های هدفمند کاری شده است. این تغییر خلق و انرژی برای اطرافیان کاملاً محسوس است، اما باعث افت شدید عملکرد شغلی یا اجتماعی نشده، نیازی به بستری شدن پیدا نکرده و هیچ علامت روان‌پریشی نیز ندارد. او سال گذشته یک دوره ۲ ماهه افسردگی اساسی را تجربه کرده است. تشخیص DSM-5-TR چیست؟", "opts": [["الف", "اختلال دوقطبی نوع یک (Bipolar I Disorder)"], ["ب", "اختلال دوقطبی نوع دو (Bipolar II Disorder)"], ["ج", "اختلال سیکلوتایمیا (Cyclothymic Disorder)"], ["د", "اختلال شخصیت مرزی"]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل ملاک‌ها و آستانه‌ها (B07 / B08):<\/strong><ul>\n<li>اپیزود توصیف‌شده (حداقل <strong>۴ روز متوالی<\/strong> خلق بالا و افزایش انرژی + عدم افت شدید عملکرد + عدم نیاز به بستری + فقدان علائم روان‌پریشی) دقیقاً تعریف <strong>اپیزود هیپومانیا<\/strong> است.<\/li>\n<li>ترکیبِ <strong>حداقل یک اپیزود هیپومانیا + حداقل یک اپیزود افسردگی اساسی<\/strong> (بدون هیچ سابقه مانیای کامل در طول عمر) تشخیص قطعی <strong>اختلال دوقطبی نوع دو (ب)<\/strong> را مسجل می‌کند. (اگر بستری یا روان‌پریشی یا مدت $\\ge 7$ روز با افت شدید عملکرد وجود داشت، مانیا و دوقطبی نوع یک محسوب می‌شد).<\/li>\n<\/ul>\n<\/li>\n<\/ul>"}, {"n": 34, "section": "آسیب‌شناسی روانی و تشخیص بالینی بر اساس DSM-5-TR", "booklet": "دفترچه سوم", "q": "پسری ۹ ساله به دلیل طغیان‌های خشم شدید و مکرر (کلامی و رفتاری) که به طور متوسط هفته‌ای ۴ بار در خانه و مدرسه رخ می‌دهد ارجاع شده است. مادرش گزارش می‌دهد که در فواصل بین این طغیان‌ها نیز، خلق کودک تقریباً هر روز و در بیشتر ساعات روز به صورت پایدار تحریک‌پذیر، عصبانی و عبوس است. این وضعیت از ۷ سالگی بدون حتی یک ماه وقفه ادامه داشته است. تشخیص ارجح بر اساس DSM-5-TR کدام است؟", "opts": [["الف", "اختلال دوقطبی کودکان"], ["ب", "اختلال نافرمانی مقابله‌جویی (ODD)"], ["ج", "اختلال کژتنظیمی خلقی ایذایی (DMDD)"], ["د", "اختلال انفجاری متناوب (IED)"]], "ans": "ج", "exp": "<ul>\n<li><strong>تحلیل ملاک‌ها و افتراق (B07 / B08 / B10):<\/strong><ul>\n<li><strong>اختلال کژتنظیمی خلقی ایذایی (DMDD):<\/strong> در فصل اختلالات افسردگی قرار دارد و برای جلوگیری از تشخیص بیش‌ازحد دوقطبی در کودکان ایجاد شده است. ملاک‌های کلیدی آن عبارت‌اند از: ۱. طغیان‌های خشم شدید <strong>حداقل ۳ بار در هفته<\/strong>؛ ۲. <strong>خلق تحریک‌پذیر یا خشمگین پایدار در فواصل بین طغیان‌ها<\/strong> (وجه تمایز اصلی از IED که در آن خلق بین حملات عادی است)؛ ۳. تداوم حداقل <strong>۱۲ ماه<\/strong> بدون دوره بدون علامتِ ۳ ماهه یا بیشتر؛ ۴. سن شروع قبل از <strong>۱۰ سالگی<\/strong> (تشخیص فقط در بازه سنی <strong>۶ تا ۱۸ سال<\/strong> گذاشته می‌شود).<\/li>\n<li><strong>تله آزمونی (B12):<\/strong> طبق سلسله‌مراتب DSM-5-TR، اگر کودکی هم‌زمان ملاک‌های DMDD و ODD (گزینه ب) را پر کند، <strong>فقط تشخیص DMDD<\/strong> گذاشته می‌شود.<\/li>\n<\/ul>\n<\/li>\n<\/ul>"}, {"n": 35, "section": "آسیب‌شناسی روانی و تشخیص بالینی بر اساس DSM-5-TR", "booklet": "دفترچه سوم", "q": "در مقایسه دو مشخصه (Specifier) «با ویژگی‌های مالیخولیایی (Melancholic)» و «با ویژگی‌های غیرمعمول (Atypical)» در اختلال افسردگی اساسی، کدام گزینه کاملاً صحیح است؟", "opts": [["الف", "در افسردگی مالیخولیایی واکنش‌پذیری خلق حفظ می‌شود و پرخوابی و پرخوری وجود دارد."], ["ب", "در افسردگی مالیخولیایی فقدان تقریباً کامل لذت (Anhedonia)، بدتر بودن خلق در صبح، بیدار شدن زودهنگام صبحگاهی (حداقل ۲ ساعت زودتر) و بی‌اشتهایی/کاهش وزن دیده می‌شود؛ در حالی که در افسردگی آتیپیک واکنش‌پذیری خلق (بهتر شدن خلق در برابر رویدادهای مثبت)، پرخوابی، پرخوری، فلج سربی (احساس سنگینی در دست و پا) و حساسیت مفرط به طرد میان‌فردی وجود دارد."], ["ج", "هر دو مشخصه تنها در اختلال دوقطبی کاربرد دارند."], ["د", "فلج سربی و بیدار شدن زودهنگام صبحگاهی هر دو از علائم اختصاصی افسردگی آتیپیک هستند."]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل افتراقی (B10):<\/strong> جدول مقایسه مشخصه‌های مالیخولیایی و آتیپیک یکی از پرتکرارترین سوالات آزمون صلاحیت و ارشد است. کلیدواژه اختصاصی مالیخولیایی <strong>«عدم واکنش‌پذیری خلق + بدتر بودن صبحگاهی + بیداری زودهنگام»<\/strong> و کلیدواژه اختصاصی آتیپیک <strong>«واکنش‌پذیری خلق + علائم نباتی معکوس (پرخوابی/پرخوری) + فلج سربی + حساسیت به طرد»<\/strong> است.<\/li>\n<\/ul>"}, {"n": 36, "section": "آسیب‌شناسی روانی و تشخیص بالینی بر اساس DSM-5-TR", "booklet": "دفترچه سوم", "q": "مراجعی ۴۰ ساله گزارش می‌دهد که پس از تجربه دو حمله غیرمنتظره تپش قلب شدید، تنگی نفس، سرگیجه و ترس از مردن در مغازه (که هر کدام ظرف ۱۰ دقیقه به اوج رسیده بودند)، اکنون به مدت ۲ ماه است که دائماً نگران وقوع حمله بعدی است و به همین دلیل از رفتن به جاهای شلوغ و رانندگی در بزرگراه‌ها خودداری می‌کند، اما از سوار شدن به آسانسور یا ماندن در خانه به تنهایی ترسی ندارد. تشخیص دقیق بر اساس DSM-5-TR چیست؟", "opts": [["الف", "فقط اختلال وحشت‌زدگی (Panic Disorder)"], ["ب", "اختلال وحشت‌زدگی به همراه گذرهراسی (Panic Disorder and Agoraphobia) — دو تشخیص هم‌زمان"], ["ج", "فقط گذرهراسی (Agoraphobia)"], ["د", "اختلال اضطراب بیماری (Illness Anxiety Disorder)"]], "ans": "الف", "exp": "<ul>\n<li><strong>تحلیل ملاک‌ها و تغییرات راهنما (B07 / B08 / B49):<\/strong><ol>\n<li>در DSM-5 و DSM-5-TR، اختلال پانیک و گذرهراسی از هم تفکیک شده‌اند (در صورت وجود هر دو، دو تشخیص مجزا گذاشته می‌شود).<\/li>\n<li>برای تشخیص <strong>اختلال پانیک<\/strong>، وجود حملات پانیک غیرمنتظره مکرر + <strong>حداقل ۱ ماه<\/strong> نگرانی مداوم درباره حملات بعدی یا تغییر ناسازگارانه رفتاری (اجتناب) کافی است.<\/li>\n<li>برای تشخیص <strong>گذرهراسی (Agoraphobia)<\/strong>، ترس و اجتناب باید در <strong>حداقل ۲ موقعیت از ۵ موقعیت استاندارد<\/strong> (۱. حمل‌ونقل عمومی، ۲. فضاهای باز، ۳. فضاهای بسته، ۴. ایستادن در صف یا شلوغی، ۵. بیرون بودن از خانه به تنهایی) به مدت <strong>حداقل ۶ ماه<\/strong> تداوم داشته باشد. در این سناریو، مدت زمان اجتناب تنها ۲ ماه است (کمتر از ۶ ماهِ لازم برای گذرهراسی)، بنابراین فعلاً فقط ملاک‌های <strong>اختلال وحشت‌زدگی (الف)<\/strong> پر می‌شود.<\/li>\n<\/ol>\n<\/li>\n<\/ul>"}, {"n": 37, "section": "آسیب‌شناسی روانی و تشخیص بالینی بر اساس DSM-5-TR", "booklet": "دفترچه سوم", "q": "در تشخیص افتراقی «اختلال وسواسی-جبری (OCD)» از «اختلال شخصیت وسواسی-جبری (OCPD)»، کدام گزاره دقیق‌ترین معیار تمایز بر اساس DSM-5-TR است؟", "opts": [["الف", "در OCPD توهم و هذیان وجود دارد اما در OCD وجود ندارد."], ["ب", "در OCD افکار وسواسیِ مزاحم و ناخواسته (Obsessions) و اعمال جبری تکراری (Compulsions) واقعی وجود دارد که معمولاً ناهمخوان با من (Ego-dystonic) هستند؛ در حالی که در OCPD وسواس و جبر واقعی وجود ندارد، بلکه الگوی نافذ و همخوان با من (Ego-syntonic) از کمال‌گرایی، نظم افراطی و کنترل‌گری دیده می‌شود."], ["ج", "OCPD تنها در کودکان تشخیص داده می‌شود و OCD در بزرگسالان."], ["د", "مبتلایان به OCD هرگز برای درمان مراجعه نمی‌کنند، اما مبتلایان به OCPD به شدت از کمال‌گرایی خود رنج می‌برند."]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل افتراقی (B10):<\/strong> وجه تمایز طلایی OCD و OCPD، حضور <strong>وسواس‌ها و جبرهای واقعی و Ego-dystonic در OCD<\/strong> در برابر <strong>الگوی شخصیتی کمال‌گرایی، انعطاف‌ناپذیری و جزئی‌نگریِ Ego-syntonic (بدون آداب جبری واقعی) در OCPD<\/strong> است (اگر فردی هر دو دسته ملاک را داشته باشد، هر دو تشخیص هم‌زمان گذاشته می‌شود).<\/li>\n<\/ul>"}, {"n": 38, "section": "آسیب‌شناسی روانی و تشخیص بالینی بر اساس DSM-5-TR", "booklet": "دفترچه سوم", "q": "مردی ۵۸ ساله خانه‌اش انباشته از روزنامه‌های قدیمی، قوطی‌های خالی کنسرو و لباس‌های کهنه است به طوری که اتاق نشیمن و آشپزخانه غیرقابل استفاده شده‌اند. زمانی که فرزندانش قصد دور ریختن این اشیاء را دارند، او دچار اضطراب و پریشانی شدیدی می‌شود؛ زیرا معتقد است روزی به این وسایل نیاز پیدا خواهد کرد و به آن‌ها دلبستگی عاطفی دارد. بهترین تشخیص کدام است؟", "opts": [["الف", "اختلال وسواسی-جبری (OCD)"], ["ب", "اختلال احتکار (Hoarding Disorder)"], ["ج", "اسکیزوفرنی"], ["د", "اختلال عصب‌شناختی عمده"]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل ملاک‌ها (B07):<\/strong> در DSM-5-TR، <strong>اختلال احتکار<\/strong> یک اختلال مستقل در فصل اختلالات وسواسی-جبری و مرتبط است. هسته اصلی آن <strong>ناتوانی مستمر در دور ریختن یا دل کندن از دارایی‌ها صرف‌نظر از ارزش واقعی آن‌ها<\/strong> به دلیل نیاز ادراک‌شده به نگهداری آن‌ها و پریشانی ناشی از دور ریختنشان است که منجر به شلوغی و انسداد فضای زیست (Clutter) می‌شود. (برخلاف OCD که اگر انباشتگی در آن رخ دهد، ناشی از ترس از آلودگی یا تشریفات وسواسی ناخواسته است و بیمار از جمع شدن زباله‌ها لذتی نمی‌برد).<\/li>\n<\/ul>"}, {"n": 39, "section": "آسیب‌شناسی روانی و تشخیص بالینی بر اساس DSM-5-TR", "booklet": "دفترچه سوم", "q": "دختری ۲۲ ساله، ۲۰ روز پس از نجات یافتن از یک تصادف رانندگی شدید، به دلیل کابوس‌های شبانه مکرر درباره تصادف، فلش‌بک، احساس مسخ واقعیت، اجتناب شدید از سوار شدن به خودرو، تحریک‌پذیری و گوش‌به‌زنگی مفرط به کلینیک مراجعه کرده است. تشخیص دقیق در این مقطع زمانی چیست؟", "opts": [["الف", "اختلال استرس پس از سانحه (PTSD)"], ["ب", "اختلال استرس حاد (Acute Stress Disorder - ASD)"], ["ج", "اختلال سازگاری"], ["د", "اختلال وحشت‌زدگی"]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل آستانه زمانی (B08):<\/strong><ul>\n<li><strong>اختلال استرس حاد (ASD):<\/strong> تداوم علائم (حداقل ۹ علامت از ۵ طبقه: مزاحم، خلق منفی، تجزیه‌ای، اجتنابی و برانگیختگی) از <strong>۳ روز تا ۱ ماه (۳۰ روز)<\/strong> پس از مواجهه با تروما.<\/li>\n<li><strong>اختلال استرس پس از سانحه (PTSD):<\/strong> تداوم علائم برای <strong>بیش از ۱ ماه<\/strong> (حداقل از هر ۴ طبقه: علائم مزاحم، اجتناب، تغییرات منفی در شناخت و خلق، و تغییرات در برانگیختگی و واکنش‌پذیری). از آنجا که در این سناریو <strong>۲۰ روز<\/strong> از حادثه گذشته است، تشخیص قطعی <strong>ASD (ب)<\/strong> است.<\/li>\n<\/ul>\n<\/li>\n<\/ul>"}, {"n": 40, "section": "آسیب‌شناسی روانی و تشخیص بالینی بر اساس DSM-5-TR", "booklet": "دفترچه سوم", "q": "مراجعی ۳۶ ساله بدون داشتن هیچ‌گونه علامت جسمی (یا با یک علامت جسمی بسیار جزئی و گذرا)، به مدت ۸ ماه است که به شدت نگران و مضطرب است که مبادا به سرطان ریه مبتلا شده باشد. او مکرراً بدن خود را وارسی می‌کند و با وجود آزمایش‌ها و سی‌تی‌اسکن‌های مکرر طبیعی، اطمینان خاطر پزشکان تنها برای چند ساعت اضطراب او را کاهش می‌دهد. در مقابل، مراجع دیگری به مدت ۸ ماه دردهای واقعی و مزمن شکمی و کمردرد دارد و زمان، انرژی و اضطراب افراطی و نامتناسبی را صرف این علائم جسمی واقعی می‌کند. تشخیص این دو مراجع به ترتیب بر اساس DSM-5-TR چیست؟", "opts": [["الف", "مراجع اول: اختلال نشانه جسمانی (SSD) / مراجع دوم: اختلال اضطراب بیماری (IAD)"], ["ب", "مراجع اول: اختلال اضطراب بیماری (IAD) / مراجع دوم: اختلال نشانه جسمانی (SSD)"], ["ج", "هر دو: اختلال تبدیلی (Conversion Disorder)"], ["د", "مراجع اول: هذیان جسمانی / مراجع دوم: تمارض"]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل افتراقی بسیار مهم (B10):<\/strong> در DSM-5-TR تشخیص قدیمی «خودبیمارانگاری (Hypochondriasis)» به دو اختلال تقسیم شده است:<ol>\n<li><strong>اختلال اضطراب بیماری (Illness Anxiety Disorder - IAD):<\/strong> علائم جسمی <strong>وجود ندارد یا بسیار خفیف است<\/strong>، اما اشتغال ذهنی و اضطراب شدید درباره <em>ابتلا به یک بیماری جدی<\/em> وجود دارد (با دو زیرنوعِ مراقبت‌طلب و مراقبت‌گریز؛ مدت $\\ge 6$ ماه).<\/li>\n<li><strong>اختلال نشانه جسمانی (Somatic Symptom Disorder - SSD):<\/strong> <strong>یک یا چند علامت جسمی واقعی و آزاردهنده وجود دارد<\/strong> و فرد افکار، احساسات و رفتارهای افراطی و نامتناسبی پیرامون همان علائم جسمی نشان می‌دهد (مدت $\\ge 6$ ماه).<\/li>\n<\/ol>\n<\/li>\n<\/ul>"}, {"n": 41, "section": "آسیب‌شناسی روانی و تشخیص بالینی بر اساس DSM-5-TR", "booklet": "دفترچه سوم", "q": "مردی با تزریق پنهانی انسولین به خود، دچار افت قند خون شدید و تشنج می‌شود و به اورژانس مراجعه می‌کند. در بررسی‌های روان‌پزشکی مشخص می‌شود که او این کار را آگاهانه انجام می‌دهد، اما هیچ انگیزه بیرونی، مالی، فرار از خدمت سربازی یا دریافت دیه ندارد، بلکه صرفاً به دنبال قرار گرفتن در «نقش بیمار» و دریافت مراقبت پزشکی است. تشخیص صحیح کدام است؟", "opts": [["الف", "تمارض (Malingering)"], ["ب", "اختلال ساختگی تحمیل‌شده بر خود (Factitious Disorder Imposed on Self / نشانگان مونشهاوزن)"], ["ج", "اختلال نشانه عصبی کارکردی (تبدیلی)"], ["د", "اختلال نشانه جسمانی"]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل جدول مقایسه چهارگانه (B43):<\/strong><ul>\n<li><strong>تبدیلی و نشانه جسمانی:<\/strong> تولید علائم <strong>ناخودآگاه و غیرارادی<\/strong> است و انگیزه بیرونی ندارد.<\/li>\n<li><strong>اختلال ساختگی (مونشهاوزن):<\/strong> ایجاد یا جعل علائم <strong>ارادی و آگاهانه<\/strong> است، اما انگیزه فرد <strong>درونی و روان‌شناختی (کسب نقش بیمار - Sick Role)<\/strong> بوده و در غیاب مشوق‌های بیرونی رخ می‌دهد.<\/li>\n<li><strong>تمارض (Malingering - کد V/Z):<\/strong> جعل ارادی علائم به خاطر <strong>مشوق و نفع بیرونی مشخص<\/strong> (پول، بیمه، معافیت، فرار از مجازات).<\/li>\n<\/ul>\n<\/li>\n<\/ul>"}, {"n": 42, "section": "آسیب‌شناسی روانی و تشخیص بالینی بر اساس DSM-5-TR", "booklet": "دفترچه سوم", "q": "دختری ۱۹ ساله با شاخص توده بدنی ($BMI = 16$)، ترس شدید از چاق شدن و تحریف تصویر بدنی به کلینیک ارجاع شده است. او گزارش می‌دهد که در ۳ ماه گذشته، هفته‌ای دو بار دوره‌های پرخوری (خوردن حجم زیادی غذا در مدت کوتاه همراه با احساس از دست دادن کنترل) داشته و بلافاصله پس از آن با القای استفراغ خود را پاک‌سازی کرده است. تشخیص دقیق بر اساس DSM-5-TR چیست؟", "opts": [["الف", "پراشتهایی عصبی (Bulimia Nervosa)"], ["ب", "بی‌اشتهایی عصبی، نوع پرخوری/پاک‌سازی (Anorexia Nervosa, Binge-eating/Purging Type)"], ["ج", "اختلال پرخوری (Binge-Eating Disorder)"], ["د", "بی‌اشتهایی عصبی، نوع محدودکننده (Restricting Type)"]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل تله آزمونی و افتراقی (B08 / B10 / B40):<\/strong> بسیاری از داوطلبان با دیدن عبارت «پرخوری و القای استفراغ» به اشتباه گزینه «پراشتهایی عصبی (بولیمیا)» را انتخاب می‌کنند! قانون طلایی DSM-5-TR این است که <strong>معیار اول و تعیین‌کننده، وزن بدن ($BMI$) است<\/strong>:<ul>\n<li>اگر وزن فرد به طور معناداری کمتر از حداقل طبیعی باشد ($BMI &lt; 18.5$ در بزرگسالان؛ در اینجا $BMI=16$)، حتی اگر دوره‌های پرخوری و پاک‌سازی داشته باشد، تشخیص قطعی <strong>بی‌اشتهایی عصبی، زیرنوع پرخوری/پاک‌سازی (ب)<\/strong> است.<\/li>\n<li>تشخیص <strong>پراشتهایی عصبی (الف)<\/strong> زمانی گذاشته می‌شود که وزن فرد <strong>طبیعی یا بالاتر از طبیعی<\/strong> باشد و پرخوری + رفتار جبرانی حداقل هفته‌ای ۱ بار به مدت ۳ ماه رخ دهد.<\/li>\n<\/ul>\n<\/li>\n<\/ul>"}, {"n": 43, "section": "آسیب‌شناسی روانی و تشخیص بالینی بر اساس DSM-5-TR", "booklet": "دفترچه سوم", "q": "کدام‌یک از گزینه‌های زیر، وجه تمایز اصلی «اختلال سلوک (Conduct Disorder)» از «اختلال نافرمانی مقابله‌جویی (ODD)» در DSM-5-TR است؟", "opts": [["الف", "در ODD نقض جدی حقوق اساسی دیگران، آزار جسمی به انسان و حیوانات، تخریب اموال و سرقت دیده می‌شود، اما در اختلال سلوک فقط لجبازی وجود دارد."], ["ب", "در اختلال سلوک الگوی تکراری و پایدار نقض حقوق اساسی دیگران یا هنجارها و قوانین عمده اجتماعی متناسب با سن (در ۴ محور: پرخاشگری به انسان و حیوانات، تخریب اموال، فریبکاری/سرقت و نقض جدی قوانین) وجود دارد؛ در حالی که در ODD الگوی خلق خشمگین/تحریک‌پذیر، رفتار جروبحث‌کننده/نافرمان و کینه‌توزی بدون نقض شدید حقوق جسمی و مالکیت دیگران دیده می‌شود."], ["ج", "اختلال سلوک تنها پس از ۱۸ سالگی تشخیص داده می‌شود."], ["د", "مشخصه «با هیجانات جامعه‌پسند محدود (بی‌رحم - بی‌عاطفه)» مختص ODD است."]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل گزینه صحیح:<\/strong> در ODD علائم به ۳ خوشه (خلق خشمگین/تحریک‌پذیر، رفتار جروبحث‌کننده/مقابله‌جو، کینه‌توزی؛ حداقل ۴ علامت به مدت $\\ge 6$ ماه) محدود است و شامل تعرض جسمی، سرقت و تخریب اموال نمی‌شود. مشخصه <strong>با هیجانات جامعه‌پسند محدود (With Limited Prosocial Emotions / Callous-Unemotional)<\/strong> متعلق به <strong>اختلال سلوک<\/strong> است که پیش‌درآمد اختلال شخصیت ضداجتماعی در بزرگسالی محسوب می‌شود.<\/li>\n<\/ul>"}, {"n": 44, "section": "آسیب‌شناسی روانی و تشخیص بالینی بر اساس DSM-5-TR", "booklet": "دفترچه سوم", "q": "مردی ۷۲ ساله به دلیل شکایت از فراموشی و افت تمرکز به کلینیک آورده شده است. در مصاحبه مشخص می‌شود که علائم او به صورت نسبتا ناگهانی پس از یک رویداد استرس‌زا شروع شده، خودِ بیمار با اضطراب و بزرگ‌نمایی به شدت از فراموشی خود شکایت می‌کند، در آزمون وضعیت روانی به بسیاری از سوالات پاسخ «نمی‌دانم» می‌دهد، اما زمانی که تشویق و ترغیب می‌شود پاسخ‌های درستی ارائه می‌دهد و نوسان عملکرد دارد. این تابلوی بالینی بیش از همه بیانگر کدام وضعیت است؟", "opts": [["الف", "دمانس (اختلال عصب‌شناختی عمده) ناشی از بیماری آلزایمر"], ["ب", "دلیریوم (Delirium)"], ["ج", "دمانس کاذب ناشی از افسردگی سالمندی (Pseudodementia)"], ["د", "آفازی ورنیکه"]], "ans": "ج", "exp": "<ul>\n<li><strong>تحلیل افتراقی (B10):<\/strong> در جدول افتراق کلاسیک کاپلان بین <strong>دمانس واقعی (آلزایمر)<\/strong> و <strong>دمانس کاذب (Pseudodementia ناشی از افسردگی)<\/strong>:<ul>\n<li>در <strong>دمانس کاذب (افسردگی):<\/strong> شروع مشخص‌تر و سریع‌تر است، بیمار خودش با پریشانی از نقص حافظه‌اش شکایت می‌کند، پاسخ‌های مکرر <strong>«نمی‌دانم»<\/strong> (به دلیل بی‌انگیزگی و کندی روانی) می‌دهد و با حمایت و درمان ضدافسردگی عملکرد حافظه به کلی برمی‌گردد.<\/li>\n<li>در <strong>دمانس آلزایمر:<\/strong> شروع تدریجی و موذیانه است، بیمار اغلب نقص حافظه خود را پنهان یا انکار می‌کند (Confabulation یا توجیه)، برای یافتن کلمات تلاش می‌کند اما واقعاً قادر به یادآوری نیست و در شب‌ها بدتر می‌شود (پدیده غروب‌آفتاب).<\/li>\n<\/ul>\n<\/li>\n<\/ul>"}, {"n": 45, "section": "آسیب‌شناسی روانی و تشخیص بالینی بر اساس DSM-5-TR", "booklet": "دفترچه سوم", "q": "مراجع الف (۲۸ ساله) هیچ تمایلی به برقراری روابط صمیمانه، دوستی یا ازدواج ندارد، مشاغل انفرادی شبانه را ترجیح می‌دهد، نسبت به تحسین یا انتقاد دیگران کاملاً بی‌تفاوت است و از تنهایی خود رنج نمی‌برد. در مقابل، مراجع ب (۲۶ ساله) به شدت آرزومند داشتن دوست و رابطه عاطفی است، اما به دلیل ترس فلج‌کننده از طرد شدن، مسخره شدن و احساس بی‌کفایتی، از ورود به جمع‌ها و روابط جدید اجتناب می‌کند مگر آنکه مطمئن باشد او را دوست دارند. تشخیص اختلال شخصیت در مراجع الف و ب به ترتیب کدام است؟", "opts": [["الف", "الف: اسکیزوتایپال / ب: پارانوئید"], ["ب", "الف: اسکیزوئید (Schizoid) / ب: اجتنابی (Avoidant)"], ["ج", "الف: اجتنابی / ب: وابسته (Dependent)"], ["د", "الف: ضداجتماعی / ب: مرزی"]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل افتراقی (B10):<\/strong> هر دو اختلال <strong>اسکیزوئید (خوشه A)<\/strong> و <strong>اجتنابی (خوشه C)<\/strong> در ظاهر با انزوای اجتماعی مشخص می‌شوند، اما تفاوت بنیادین در <strong>انگیزه درونی<\/strong> است: فرد <strong>اسکیزوئید<\/strong> واقعاً میل و نیازی به رابطه انسانی ندارد و به انتقاد بی‌تفاوت است؛ اما فرد <strong>اجتنابی<\/strong> تشنه رابطه و پذیرش است ولی از ترس <strong>نقد و طرد شدن (حساسیت مفرط به ارزیابی منفی)<\/strong> کناره‌گیری می‌کند.<\/li>\n<\/ul>"}, {"n": 46, "section": "آسیب‌شناسی روانی و تشخیص بالینی بر اساس DSM-5-TR", "booklet": "دفترچه سوم", "q": "کدام‌یک از ویژگی‌های زیر، معیار تشخیصی اختصاصی «اختلال شخصیت مرزی (Borderline)» در خوشه B بوده و آن را از «اختلال شخصیت نمایشی (Histrionic)» متمایز می‌سازد؟", "opts": [["الف", "توجه طلبی و استفاده از ظاهر فیزیکی برای جلب توجه."], ["ب", "احساس پوچی مزمن، بی‌ثباتی شدید هویت و خودانگاره، تلاش‌های مذبوحانه برای اجتناب از رهاشدگی، رفتارهای خودزنی/خودکشی مکرر و علائم تجزیه‌ای یا پارانوئید گذرای مرتبط با استرس."], ["ج", "تلقین‌پذیری بالا و سطحی و نمایشی بودن هیجانات."], ["د", "بی‌توجهی به قوانین و فریبکاری از پیش از ۱۵ سالگی."]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل افتراقی (B10):<\/strong> در حالی که در اختلال شخصیت نمایشی (الف و ج) توجه طلبی، اغواگری و هیجانات کم‌عمق وجود دارد، در <strong>اختلال شخصیت مرزی (ب)<\/strong> هسته آسیب‌شناسی شامل <strong>آشفتگی هویت، احساس پوچی مزمن، خشم نامتناسب، دوپاره‌سازی (Splitting)، خودآسیب‌رسانی و علائم شبه‌روان‌پریشی/تجزیه‌ای گذرا<\/strong> است.<\/li>\n<\/ul>"}, {"n": 47, "section": "آسیب‌شناسی روانی و تشخیص بالینی بر اساس DSM-5-TR", "booklet": "دفترچه سوم", "q": "بیماری که به تازگی مصرف داروی هالوپریدول (ضدروان‌پریشی نسل اول) را با دوز بالا آغاز کرده است، با تب بسیار بالا ($40^\\circ\\text{C}$)، سفتی شدید عضلانی به صورت «لوله سربی (Lead-pipe rigidity)»، بی‌ثباتی علائم حیاتی (فشار خون و ضربان قلب نوسانی)، تعریق شدید، تغییر سطح هوشیاری و افزایش شدید آنزیم کراتین کیناز ($CPK$) به اورژانس منتقل می‌شود. این وضعیت کشنده کدام است؟", "opts": [["الف", "دیستونی حاد (Acute Dystonia)"], ["ب", "آکاتژیا (Akathisia)"], ["ج", "نشانگان نورولپتیک بدخیم (Neuroleptic Malignant Syndrome - NMS)"], ["د", "دیسکینزی دیررس (Tardive Dyskinesia)"]], "ans": "ج", "exp": "<ul>\n<li><strong>تحلیل پرچم قرمز دارویی (B06 / B27):<\/strong> <strong>سندرم نورولپتیک بدخیم (NMS)<\/strong> خطرناک‌ترین و مرگبا ng>مرزی و ضداجتماعی<\/strong> را تشکیل می‌دهد.<\/li>\n<\/ul>"}, {"n": 70, "section": "سنجش روانی، روان‌سنجی و تفسیر آزمون‌های هوش و شخصیت", "booklet": "دفترچه پنجم", "q": "در نظام جامع رورشاخ اکسنر (Exner's Comprehensive System)، کدام‌یک از شاخص‌ها و نسبت‌های زیر نشان‌دهنده «انعطاف‌پذیری، ظرفیت ایده‌پردازی و تخیل پخته انسانی» است و کدام شاخص مستقیماً برای هشدار درباره «خطر بالقوه خودکشی» به کار می‌رود؟", "opts": [["الف", "پاسخ‌های حرکت انسانی ($M$) نشان‌دهنده ایده‌پردازی، تأمل و همدلی؛ و صورت‌فلکی خودکشی ($S-CON$ با نقطه برش $\\ge 8$) نشان‌دهنده خطر جدی خودکشی."], ["ب", "پاسخ‌های رنگ محض ($C$) نشان‌دهنده کنترل شناختی بالا؛ و شاخص $DEPI$ نشان‌دهنده اسکیزوفرنی."], ["ج", "پاسخ‌های کل‌نگر ($W$) نشان‌دهنده خطر خودکشی."], ["د", "پاسخ‌های فضای سفید ($S$) نشان‌دهنده همدلی بالا."]], "ans": "الف", "exp": "<ul>\n<li><strong>تحلیل کدهای اکسنر در رورشاخ (B31 / B33):<\/strong><ul>\n<li>در نظام اکسنر، کدهای تعیین‌کننده (Determinants) شامل <strong>حرکت انسانی ($M$)<\/strong> بیانگر تفکر، خیال‌پردازی، به تأخیر انداختن تکانه و ظرفیت همدلی است؛ در حالی که پاسخ‌های <strong>رنگ محض ($C$)<\/strong> نشان‌دهنده تخلیه هیجانی کنترل‌نشده و تکانشی، و پاسخ‌های <strong>فضای سفید ($S$)<\/strong> نشان‌دهنده منفی‌کاری، خشم و مخالفت‌ورزی است.<\/li>\n<li>شاخص <strong>$S-CON$ (Suicide Constellation)<\/strong> از ۱۲ متغیر تشکیل شده که اگر نمره آن <strong>۸ یا بیشتر<\/strong> شود، پرچم قرمز خطر فوری خودکشی است.<\/li>\n<\/ul>\n<\/li>\n<\/ul>"}, {"n": 71, "section": "سنجش روانی، روان‌سنجی و تفسیر آزمون‌های هوش و شخصیت", "booklet": "دفترچه پنجم", "q": "بیماری با سابقه ضربه مغزی به قطعه پیشانی (Frontal Lobe) در اجرای «آزمون دسته‌بندی کارت‌های ویسکانسین (WCST)»، پس از آنکه قاعده دسته‌بندی توسط آزمونگر از «رنگ» به «شکل» تغییر می‌کند، همچنان به دسته‌بندی کارت‌ها بر اساس «رنگ» ادامه می‌دهد و با وجود دریافت بازخورد منفی قادر به تغییر راهبرد خود نیست. این خطای شاخص عصب-روان‌شناختی چه نام دارد و کدام کارکرد اجرایی را می‌سنجد؟", "opts": [["الف", "خطای درجاماندگی یا مواظبت (Perseverative Error) — سنجش انعطاف‌پذیری ش actance)» و «سبک مقابله‌ای درونی‌ساز (Internalizing)» است، کدام الگوی درمانی بیشترین اثربخشی را دارد؟", "opts": [["الف", "درمان‌های کاملاً دستورالعملی، آمرانه، ساختاریافته و رفتاریِ معطوف به علامت توسط درمانگری مقتدر و هدایت‌گر."], ["ب", "درمان‌های غیردستورالعملی، اکتشافی، بینش‌مدار، مراجع‌محور یا فراتئوریک که در آن خودمختاری مراجع حفظ شده و بر کشف تعارضات درونی و هیجانی تمرکز می‌شود."], ["ج", "بستری اجباری و شوک الکتریکی."], ["د", "آموزش مستقیم مهارت‌های رفتاری با تکالیف خانگی اجباری و سخت‌گیرانه."]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل مدل STS بوتلر در مارنات (B22 / B30):<\/strong> بوتلر نشان داد که:<ol>\n<li><strong>سطح مقاومت (Reactance) $\\leftrightarrow$ میزان هدایت‌گری درمانگر:<\/strong> مراجعان با مقاومت بالا در برابر درمان‌های دستوری و ساختاریافته (مثل CBT کلاسیک آمرانه) لجبازی و ریزش نشان می‌دهند و با <strong>درمان‌های غیردستوری و مراجع‌محور/پویشی<\/strong> بهترین نتیجه را می‌گیرند (و برعکس، مراجعان کم‌مقاومت از درمان‌های ساختاریافته و هدایت‌گر سود می‌برند).<\/li>\n<li><strong>سبک مقابله‌ای (درونی‌ساز در برابر برونی‌ساز) $\\leftrightarrow$ کانون درمان:<\/strong> افراد <strong>درونی‌ساز<\/strong> (خودسرزنش‌گر، مضطرب و متفکر) از درمان‌های <strong>بینش‌مدار و هیجانی<\/strong>، و افراد <strong>برونی‌ساز<\/strong> (تکانشی و فرافکن) از درمان‌های <strong>علامت‌مدار و رفتاری-مهارتی<\/strong> بیشترین بهره را می‌برند.<\/li>\n<\/ol>\n<\/li>\n<\/ul>"}, {"n": 74, "section": "سنجش روانی، روان‌سنجی و تفسیر آزمون‌های هوش و شخصیت", "booklet": "دفترچه پنجم", "q": "بر اساس اصول «گزارش‌نویسی روان‌شناختی مراجع‌محور» در کتاب مارنات، کدام‌یک از جملات زیر برای درج در بخش خلاصه و نتیجه‌گیری گزارش سنجش استانداردتر است؟", "opts": [["الف", "«آزمودنی در مقیاس ۲ آزمون MMPI-2 نمره $T=78$ و در مقیاس ۷ نمره $T=75$ گرفت و شاخص $DEPI$ او در رورشاخ ۶ بود.»"], ["ب", "«پاسخ‌های آقای الف نشان می‌دهد که او در حال حاضر غمگینی عمیق، احساس گناه، خستگی مفرط و نگرانی‌های وسواس‌گونه و نشخوارهای فکری مداومی را تجربه می‌کند که تمرکز شغلی او را مختل کرده است؛ یافته‌هایی که با مشاهدات جلسه مصاحبه i>\n<\/ul>"}, {"n": 76, "section": "سنجش روانی، روان‌سنجی و تفسیر آزمون‌های هوش و شخصیت", "booklet": "دفترچه پنجم", "q": "در تفسیر «پرسشنامه افسردگی بک ویراست دوم (BDI-II)» که شامل ۲۱ ماده چهارگزینه‌ای (نمره ۰ تا ۳ برای هر ماده و دامنه کل ۰ تا ۶۳) است، کسب نمره ۳۴ بیانگر کدام سطح از افسردگی است و کدام دو ماده آن باید در همان ابتدای جلسه به عنوان پرچم قرمز بررسی شوند؟", "opts": [["الف", "افسردگی خفیف — ماده‌های خواب و اشتها"], ["ب", "افسردگی شدید (نمره ۲۹ تا ۶۳) — ماده ۹ (افکار یا امیال خودکشی) و ماده ۲ (ناامیدی / بدبینی نسبت به آینده)"], ["ج", "عدم وجود افسردگی — ماده‌های گریه و خستگی"], ["د", "اختلال دوقطبی — ماده کاهش میل جنسی"]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل نقاط برش BDI-II (B27 / B31):<\/strong> نقاط برش استاندارد BDI-II عبارت‌اند از: <strong>۰ تا ۱۳ (کمترین/طبیعی)<\/strong>، <strong>۱۴ تا ۱۹ (خفیف)<\/strong>، <strong>۲۰ تا ۲۸ (متوسط)<\/strong> و <strong>۲۹ تا ۶۳ (شدید)<\/strong>. طبق مارنات و بک، روان‌شناس بالینی موظف است به محض تحویل گرفتن برگه BDI-II، قبل از جمع زدن کل نمرات، به سراغ <strong>ماده ۲ (ناامیدی/بدبینی)<\/strong> و <strong>ماده ۹ (افکار خودکشی)<\/strong> برود؛ زیرا این دو ماده قوی‌ترین پیش‌بینی‌کننده‌های خطر خودکشی هستند.<\/li>\n<\/ul>"}, {"n": 77, "section": "سنجش روانی، روان‌سنجی و تفسیر آزمون‌های هوش و شخصیت", "booklet": "دفترچه پنجم", "q": "در آزمون دیداری-حرکتی بندر-گشتالت (Bender-Gestalt II)، مشاهده خطاهای شدید شامل «چرخش بیش از ۴۵ درجه اشکال (Rotation)، درجاماندگی (Perseveration)، قطع شدن و عدم یکپارچگی اجزای شکل و برخورد اشکال با یکدیگر (Collision)» در یک بزرگسال، بیش از همه فرضیه کدام آسیب را تقویت می‌کند؟", "opts": [["الف", "اختلال اضطراب اجتماعی خفیف"], ["ب", "آسیب مغزی عضوی / اختلال عصب‌شناختی و نقایص دیداری-فضایی و اجرایی"], ["ج", "هوش بالای کلامی"], ["د", "اختلال شخصیت نمایشی"]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل بندر-گشتالت (B30 / B33):<\/strong> خطاهای چرخش شدید، درجاماندگی (کشیدن بیش‌ازحد نقاط یا دایره‌ها)، گسیختگی گشتالت و تصادم اشکال از شاخص‌های کلاسیک <strong>آسیب‌های مغزی عضوی (آسیب‌های قشر آهیانه‌ای-پ انگیزد.<\/li>\n<li><strong>فعال / آشیانه‌گزینی (Active / Niche-Picking):<\/strong> با افزایش سن و استقلال، خودِ کودک فعالانه محیط‌ها، فعالیت‌ها و دوستانی را جستجو و انتخاب می‌کند که با گرایش‌های ژنتیکی او سازگارند.<\/li>\n<\/ol>\n<\/li>\n<\/ul>"}, {"n": 80, "section": "روان‌شناسی رشد و تحول، و مداخلات کودک و نوجوان", "booklet": "دفترچه ششم", "q": "کودکی ۵ ساله هنگام حل یک پازل دشوار با صدای بلند با خودش صحبت می‌کند: «اول باید تکه قرمز را بگذارم اینجا، نه، این کج است، باید بچرخانمش...». ژان پیاژه و لو ویگوتسکی این پدیده را به ترتیب چه می‌نامند و چه نقشی برای آن قائل هستند؟", "opts": [["الف", "پیاژه: گفتار اجتماعی؛ ویگوتسکی: گفتار اوتیستیک"], ["ب", "پیاژه: گفتار خودمیاندارانه (Egocentric Speech) ناشی از ناتوانی شناختی در درنگری دیدگاه دیگری که با رشد حذف می‌شود؛ ویگوتسکی: گفتار خصوصی (Private Speech) که ابزار حیاتی خودهدایتی و خودتنظیمی تفکر است و با رشد به صورت گفتار درونی (تفکر کلامی خاموش) درونی‌سازی می‌شود."], ["ج", "هر دو آن را نشانه اختلال طیف اوتیسم می‌دانند."], ["د", "پیاژه آن را نشانه عملیات صوری و ویگوتسکی آن را نشانه بازتاب‌های اولیه می‌داند."]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل مقایسه پیاژه و ویگوتسکی (B10):<\/strong> یکی از پرتکرارترین سوالات آزمون صلاحیت و ارشد، مقایسه نگاه پیاژه (<strong>گفتار خودمیاندارانه<\/strong> به عنوان نشانه خامی شناختی) با نگاه ویگوتسکی (<strong>گفتار خصوصی<\/strong> به عنوان ستون فقرات خودتنظیمی شناختی در منطقه تقریبی رشد $ZPD$) است.<\/li>\n<\/ul>"}, {"n": 81, "section": "روان‌شناسی رشد و تحول، و مداخلات کودک و نوجوان", "booklet": "دفترچه ششم", "q": "در آزمایش «موقعیت ناآشنا (Strange Situation)» مری اینزورث، کودک ۱۴ ماهه‌ای هنگام حضور مادر به او می‌چسبد و به کاوش اسباب‌بازی‌ها نمی‌پردازد. زمانی که مادر اتاق را ترک می‌کند به شدت مضطرب و بی‌قرار می‌شود، اما هنگامی که مادر بازمی‌گردد و او را در آغوش می‌گیرد، کودک ضمن چسبیدن به مادر، با خشم به او لگد می‌زند، اسباب‌بازی را پرت می‌کند و با وجود تلاش مادر آرام نمی‌شود. الگوی دلبستگی این کودک و سبک مراقبتی مادر او کدام است؟", "opts": [["الف", "دلبستگی ایمن (Secure) — مادر حساس و پاسخگو"], ["ب", "دلبستگی ناایمن اجتنابی (Insecure-Avoidant) — مادر طردکننده و مداخله‌گر افراطی"], ["ج", "دلبستگی ناایمن مقاوم یا دوسوگرا (Insecure-Resistant / Ambivalent) — مراقبت بی‌ثبات، غیرقابل پیش‌بینی و نامنظم مادر"], ["د", "دلبستگی آشفته / سازمان‌نیافته (Disorganized) — مادر ترساننده یا ترسیده (کودک‌آزاری)"]], "ans": "ج", "exp": "<ul>\n<li><strong>تحلیل الگوهای دلبستگی اینزورث و بالبی (B10 / B43):<\/strong><ul>\n<li><strong>ناایمن اجتنابی (ب):<\/strong> کودک هنگام خروج مادر واکنش کمی نشان می‌دهد و هنگام بازگشت مادر، به او بی‌محلی کرده و رو برمی‌گرداند.<\/li>\n<li><strong>ناایمن مقاوم / دوسوگرا (ج):<\/strong> کودک قبل از جدایی مضطرب و چسبنده است، در جدایی به شدت بی‌قرار می‌شود و در بازگشت مادر، ترکیبی از <strong>نزدیکی‌جویی و خشم/مقاومت (کتک زدن مادر و آرام نشدن)<\/strong> را نشان می‌دهد که محصول مراقبت <strong>بی‌ثبات و دمدمی‌مزاج<\/strong> مادر است.<\/li>\n<li><strong>آشفته / سازمان‌نیافته (د):<\/strong> رفتارهای متناقض، خشک‌زدگی (Freezing)، گیجی و ترس از خودِ والد.<\/li>\n<\/ul>\n<\/li>\n<\/ul>"}, {"n": 82, "section": "روان‌شناسی رشد و تحول، و مداخلات کودک و نوجوان", "booklet": "دفترچه ششم", "q": "بر اساس طبقه‌بندی سبک‌های فرزندپروری دایانا بامریند (و مک‌کوبی و مارتین) در دو بعد «پذیرش/پاسخگویی (گرمی)» و «کنترل/مطالبه‌گری (سخت‌گیری)»، والدینی که دارای پذیرش و درگیری عاطفی بسیار پایین و مطالبه‌گری و کنترل بسیار پایین هستند، چه سبکی دارند و این سبک چه پیامدی برای کودک به همراه دارد؟", "opts": [["الف", "سبک مقتدرانه (Authoritative: پذیرش بالا + کنترل منطقی بالا) — بالاترین شایستگی اجتماعی و تحصیلی."], ["ب", "سبک مستبدانه (Authoritarian: پذیرش پایین + کنترل بالا) — کودکان مضطرب، مطیع یا پرخاشگر."], ["ج", "سبک سهل‌گیر (Permissive: پذیرش بالا + کنترل پایین) — کودکان تکانشی و پرتوقع."], ["د", "سبک بی‌تفاوت یا غافل (Uninvolved / Neglectful: پذیرش پایین + کنترل پایین) — مخرب‌ترین پیامد تحولی شامل دلبستگی ناایمن، نقص شدید در خودتنظیمی، افت تحصیلی و رفتارهای ضداجتماعی در نوجوانی."]], "ans": "د", "exp": "<ul>\n<li><strong>تحلیل ماتریس فرزندپروری بامریند (B38 / B43):<\/strong> ترکیب چهارگانه بامریند ($2 \\times 2$) یکی از سوالات قطعی حوزه رشد و خانواده است؛ در حالت افراطی، سبک <strong>بی‌تفاوت/ردکننده (Uninvolved)<\/strong> شکلی از کودک‌آزاری (غفلت - Neglect) محسوب شده و بدترین پیش‌آگهی تحولی را در میان هر چهار سبک دارد.<\/li>\n<\/ul>"}, {"n": 83, "section": "روان‌شناسی رشد و تحول، و مداخلات کودک و نوجوان", "booklet": "دفترچه ششم", "q": "نوجوانی ۱۵ ساله از اینکه به خاطر یک جوش کوچک روی صورتش به مهمانی برود به شدت امتناع می‌کند و می‌گوید: «به محض اینکه وارد سالن شوم، تمام ۵۰ نفری که آنجا هستند فقط به جوش روی بینی من زل می‌زنند و درباره من پچ‌پچ می‌کنند.» در عین حال او با موتورسیکلت بدون کلاه ایمنی با سرعت بالا رانندگی می‌کند و معتقد است: «تصادف و مرگ برای بقیه اتفاق می‌افتد، من چیزیم نمی‌شود چون من فرق دارم!» بر اساس دیوید الکیند، این دو تحریف شناختی ناشی از خودمحوری نوجوانی به ترتیب چه نام دارند؟", "opts": [["الف", "اولی: افسانه شخصی (Personal Fable) / دومی: تماشاگر خیالی (Imaginary Audience)"], ["ب", "اولی: تماشاگر خیالی (Imaginary Audience) / دومی: افسانه شخصی (Personal Fable)"], ["ج", "هر دو: نگهداری ذهنی (Conservation)"], ["د", "اولی: جاندارپنداری (Animism) / دومی: برگشت‌ناپذیری"]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل مفاهیم الکیند در نوجوانی (B02 / B10):<\/strong><ol>\n<li><strong>تماشاگر خیالی (Imaginary Audience):<\/strong> باور نوجوان به اینکه او در کانون توجه و نگاه دائمی همه اطرافیان قرار دارد (منجر به خودآگاهی دردناک و شرم شدید از کوچک‌ترین نقص ظاهری).<\/li>\n<li><strong>افسانه شخصی (Personal Fable):<\/strong> باور نوجوان به اینکه چون همه به او توجه دارند، پس او موجودی کاملاً منحصربه‌فرد، استثنایی و <strong>آسیب‌ناپذیر (Invulnerable)<\/strong> است (منجر به رفتارهای پرخطر، رانندگی بی‌پروا، مصرف مواد و روابط جنسی محافظت‌نشده).<\/li>\n<\/ol>\n<\/li>\n<\/ul>"}, {"n": 84, "section": "روان‌شناسی رشد و تحول، و مداخلات کودک و نوجوان", "booklet": "دفترچه ششم", "q": "دانشجویی ۲۰ ساله بدون اینکه خودش رشته‌ها و عقاید مختلف را بررسی و کاوش کرده باشد، صرفاً به این دلیل که پدر و پدربزرگش پزشک بوده‌اند، رشته پزشکی و تمام باورهای سیاسی و مذهبی خانواده را بدون هیچ تردیدی پذیرفته و به شدت به آن‌ها متعهد است. بر اساس الگوی چهارگانه پایگاه‌های هویت جیمز مارسیا (Marcia's Identity Statuses)، این دانشجو در کدام پایگاه هویت قرار دارد؟", "opts": [["الف", "کسب هویت یا هویت موفق (Identity Achievement: کاوش بالا + تعهد بالا)"], ["ب", "وقفه یا تعلیق هویت (Identity Moratorium: کاوش بالا + تعهد پایین)"], ["ج", "هویت پیش‌رس یا ضبط‌شده (Identity Foreclosure: کاوش پایین + تعهد بالا)"], ["د", "پراکندگی یا سردرگمی هویت (Identity Diffusion: کاوش پایین + تعهد پایین)"]], "ans": "ج", "exp": "<ul>\n<li><strong>تحلیل ماتریس هویت مارسیا (B38 / B43):<\/strong> در جدول $2 \\times 2$ مارسیا (بر اساس دو بعد <strong>کاوش/بحران Exploration<\/strong> و <strong>تعهد Commitment<\/strong>): زمانی که فرد <strong>بدون طی کردن دوره کاوش و بحران (کاوش پایین)<\/strong>، اهداف و ارزش‌های والدین یا مراجع قدرت را دربست می‌پذیرد (<strong>تعهد بالا<\/strong>)، دارای <strong>هویت پیش‌رس یا ضبط‌شده (Foreclosure)<\/strong> است.<\/li>\n<\/ul>"}, {"n": 85, "section": "روان‌شناسی رشد و تحول، و مداخلات کودک و نوجوان", "booklet": "دفترچه ششم", "q": "در پاسخ به معمای اخلاقی هاینز (دزدیدن دارو برای نجات همسر سرطانی)، فردی می‌گوید: «هاینز نباید دارو را بدزدد، چون دزدی خلاف قانون است و اگر هر کسی به تشخیص خودش قانون را بشکند، نظم کل جامعه از هم می‌پاشد و سنگ روی سنگ بند نمی‌شود.» بر اساس نظریه رشد اخلاقی لورنس کلبرگ، این استدلال در کدام سطح و مرحله قرار دارد؟", "opts": [["الف", "سطح پیش‌قراردادی — مرحله ۱ (توجیه تنبیه و اطاعت)"], ["ب", "سطح قراردادی — مرحله ۳ (توافق بین‌فردی یا پسر خوب / دختر خوب)"], ["ج", "سطح قراردادی — مرحله ۴ (جهت‌گیری حفظ نظم و قانون اجتماعی)"], ["د", "سطح پس‌قراردادی — مرحله ۶ (اصول اخلاقی جهان‌شمول)"]], "ans": "ج", "exp": "<ul>\n<li><strong>تحلیل مراحل کلبرگ (B39 / B43):<\/strong> در نظریه کلبرگ، ملاک تعیین مرحله، پاسخی که فرد می‌دهد (بدزدد یا ندزدد) نیست، بلکه <strong>نحوه استدلال (Reasoning)<\/strong> پشت آن است. استدلال مبتنی بر <strong>وظیفه در قبال قانون، حفظ نظم کل سیستم اجتماعی و جلوگیری از هرج‌ومرج<\/strong>، مشخصه بارز <strong>مرحله ۴ (حفظ نظم اجتماعی در سطح اخلاق قراردادی)<\/strong> است.<\/li>\n<\/ul>"}, {"n": 86, "section": "روان‌شناسی رشد و تحول، و مداخلات کودک و نوجوان", "booklet": "دفترچه ششم", "q": "بر اساس نظریه تحول روانی-اجتماعی اریک اریکسون، بحران اصلی دوره «میانسالی» چیست و حل موفقیت‌آمیز آن به شکل‌گیری کدام فضیلت (توانمندی ایگو) می‌انجامد؟", "opts": [["الف", "صمیمیت در برابر انزوا — فضیلت عشق (Love)"], ["ب", "زایندگی در برابر رکود (Generativity vs. Stagnation) — فضیلت مراقبت و تیمارداری (Care)"], ["ج", "یکپارچگی من در برابر نومیدی (Ego Integrity vs. Despair) — فضیلت خردمندی (Wisdom)"], ["د", "سخت‌کوشی در برابر احساس حقارت — فضیلت شایستگی (Competence)"]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل جدول ۸ مرحله اریکسون (B39 / B43):<\/strong><ul>\n<li><strong>جوانی:<\/strong> صمیمیت در برابر انزوا $\\leftarrow$ فضیلت: <strong>عشق (Love)<\/strong><\/li>\n<li><strong>میانسالی:<\/strong> زایندگی (هدایت نسل بعد و خلق اثر ماندگار) در برابر رکود (خودمشغولی) $\\leftarrow$ فضیلت: <strong>مراقبت (Care)<\/strong><\/li>\n<li><strong>سالمندی:<\/strong> یکپارچگی ایگو در برابر نومیدی $\\leftarrow$ فضیلت: <strong>خرد (Wisdom)<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<\/ul>"}, {"n": 87, "section": "روان‌شناسی رشد و تحول، و مداخلات کودک و نوجوان", "booklet": "دفترچه ششم", "q": "نوازنده پیانوی ۸۰ ساله‌ای (آرتور روبینشتاین) برای مقابله با افت طبیعی سرعت انگشتان در سالمندی، سه راهبرد را به کار می‌گیرد: ۱. تعداد قطعاتی که در کنسرت می‌نوازد را کمتر می‌کند؛ ۲. همان قطعات محدودتر را ساعت‌های بیشتری تمرین می‌کند؛ ۳. قبل از رسیدن به بخش‌های سریع قطعه، عمداً ریتم را بسیار کندتر می‌نوازد تا بخش بعدی در گوش شنونده سریع‌تر به نظر برسد. این سه اقدام به ترتیب مصداق کدام مدل سازگاری موفق در سالمندی اثر «پل بالتس (Paul Baltes)» است؟", "opts": [["الف", "انکار، خشم و پذیرش"], ["ب", "انتخاب (Selection)، بهینه‌سازی (Optimization) و جبران (Compensation) — مدل $SOC$"], ["ج", "درون‌سازی، برون‌سازی و فرافکنی"], ["د", "جذب، انطباق و تعادل‌بخشی"]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل مدل SOC بالتس در لورا برک و پاپالیا (B04):<\/strong> مدل <strong>انتخاب، بهینه‌سازی و جبران ($SOC$)<\/strong> پل بالتس ستون فقرات روان‌شناسی سالمندی موفق است: ۱. <strong>انتخاب (Selection):<\/strong> محدود کردن اهداف به حوزه‌های مهم‌تر؛ ۲. <strong>بهینه‌سازی (Optimization):<\/strong> تمرین و سرمایه‌گذاری بیشتر روی همان حوزه‌های انتخابی؛ ۳. <strong>جبران (Compensation):<\/strong> یافتن ترفندها یا ابزارهای جایگزین برای پوشش کاستی‌های جسمی/شناختی.<\/li>\n<\/ul>"}, {"n": 88, "section": "روان‌شناسی رشد و تحول، و مداخلات کودک و نوجوان", "booklet": "دفترچه ششم", "q": "در نظریه بوم‌شناختی (اکولوژیک) یوری برونفن‌برنر، زمانی که «ساعت کاری طولانی و تنش‌های شدید رئیس با پدر در محیط کار» باعث می‌شود پدر خسته و عصبانی به خانه بیاید و با کودک خود با پرخاشگری رفتار کند، محیط کار پدر (که کودک مستقیماً در آن حضور ندارد اما از آن تأثیر می‌پذیرد) در کدام لایه سیستمی قرار می‌گیرد؟", "opts": [["الف", "ریزسیستم (Microsystem)"], ["ب", "میان‌سیستم (Mesosystem)"], ["ج", "برون‌سیستم (Exosystem)"], ["د", "کلان‌سیستم (Macrosystem)"]], "ans": "ج", "exp": "<ul>\n<li><strong>تحلیل سیستم‌های برونفن‌برنر (B05 / B10):<\/strong><ul>\n<li><strong>ریزسیستم:<\/strong> محیط‌های ارتباط مستقیم کودک (خانه، کلاس درس).<\/li>\n<li><strong>میان‌سیستم:<\/strong> ارتباط متقابل بین دو ریزسیستم (مثلاً رابطه اولیا و مربیان مدرسه).<\/li>\n<li><strong>برون‌سیستم (Exosystem):<\/strong> محیط‌هایی که <strong>کودک خود در آن‌ها حضور فیزیکی ندارد<\/strong>، اما رویدادهای آن به طور غیرمستقیم بر ریزسیستم کودک اثر می‌گذارد (مانند محل کار والدین، هیئت‌مدیره مدرسه، شبکه‌های حمایتی والدین).<\/li>\n<li><strong>کلان‌سیستم:<\/strong> ارزش‌های فرهنگی، قوانین و ایدئولوژی جامعه.<\/li>\n<li><strong>زمان‌سیستم (Chronosystem):<\/strong> بعد زمان و تغییرات تاریخی-طولی.<\/li>\n<\/ul>\n<\/li>\n<\/ul>"}, {"n": 89, "section": "روان‌شناسی رشد و تحول، و مداخلات کودک و نوجوان", "booklet": "دفترچه ششم", "q": "آزمایش کلاسیک «باور غلط (False-Belief Task — آزمایش سالی و آن یا جعبه اسمارتیز)» که کودکان معمولاً در حدود ۴ سالگی از عهده پاسخ صحیح به آن برمی‌آیند و کودکان مبتلا به اختلال طیف اوتیسم در آن نقص شدیدی دارند، برای سنجش کدام دستاورد شناختی-اجتماعی طراحی شده است؟", "opts": [["الف", "بقای جرم و حجم"], ["ب", "نظریه ذهن (Theory of Mind - ToM) و فرابازنمایی (درک اینکه دیگران باورها، امیال و دیدگاه‌های ذهنی متفاوتی از واقعیت و از خودِ فرد دارند)"], ["ج", "پایداری شیء (Object Permanence)"], ["د", "استدلال قیاسی"]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل مفهومی (B02):<\/strong> تکلیف <strong>باور غلط<\/strong> معیار طلایی سنجش <strong>نظریه ذهن (Theory of Mind)<\/strong> در حدود ۴ سالگی است. نقص در نظریه ذهن («کوری ذهنی / Mindblindness» به تعبیر بارون-کوهن) یکی از تبیین‌های اصلی نقایص ارتباط اجتماعی در اختلال طیف اوتیسم است.<\/li>\n<\/ul>"}, {"n": 90, "section": "روان‌شناسی رشد و تحول، و مداخلات کودک و نوجوان", "booklet": "دفترچه ششم", "q": "در برنامه «آموزش مدیریت والدین (Parent Management Training - PMT)» کازدین و بارکلی برای درمان کودکان مبتلا به اختلال نافرمانی مقابله‌جویی (ODD) و ADHD، کدام اصل در اجرای تکنیک «محروم‌سازی موقت از تقویت مثبت (Time-Out)» کاملاً صحیح است؟", "opts": [["الف", "کودک باید به مدت ۲ ساعت در یک اتاق تاریک و ترسناک حبس شود و والد در طول این مدت از پشت در او را سرزنش کند."], ["ب", "محیط Time-Out باید فاقد هرگونه محرک تقویت‌کننده و سرگرم‌کننده (تلویزیون، تبلت، اسباب‌بازی و توجه کلامی والد) باشد، مدت زمان آن کوتاه و متناسب با سن کودک (معمولاً ۱ دقیقه به ازای هر سال سن کودک) بوده و بلافاصله پس از اولین رفتار مثبت کودک پس از خروج، تقویت مثبت ارائه شود."], ["ج", "Time-Out فقط زمانی اجرا می‌شود که کودک کارهای خوب انجام می‌دهد."], ["د", "در حین Time-Out، والد باید کنار کودک بنشیند و ۳۰ دقیقه با او بحث فلسفی کند."]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل گام‌های تکنیک (B17):<\/strong> خطای رایج والدین در اجرای Time-Out، تبدیل کردن آن به تنبیه انتقام‌جویانه و طولانی، یا بحث و جدل کلامی در حین آن است (که خودِ بحث کردن برای کودکِ ODD نوعی <strong>تقویت مثبت از طریق توجه منفی<\/strong> محسوب می‌شود!). قاعده استاندارد، <strong>۱ دقیقه به ازای هر سال سن<\/strong> در مکانی امن و خنثی و بدون هیچ‌گونه تعامل کلامی/چشمی تا پایان زمان است.<\/li>\n<\/ul>"}, {"n": 91, "section": "روان‌شناسی رشد و تحول، و مداخلات کودک و نوجوان", "booklet": "دفترچه ششم", "q": "در «بازی‌درمانی کودک‌محور (Child-Centered Play Therapy)» ویرجینیا اکسلین و گری لندرث، کدام گزاره بیانگر یکی از اصول هشت‌گانه بنیادین اکسلین است؟", "opts": [["الف", "بازی‌درمانگر باید در هر جلسه اسباب‌بازی‌ها را خودش انتخاب کند و به کودک دستور دهد که چه بازی‌ای انجام دهد."], ["ب", "بازی‌درمانگر کودک را دقیقاً همان‌گونه که هست می‌پذیرد، فضای امنی برای ابراز آزادانه احساسات ایجاد می‌کند، رهبری جلسه را به کودک می‌سپارد، تلاش نمی‌کند روند درمان را شتاب دهد و تنها محدودیت‌هایی را اعمال می‌کند که برای پیوند درمان با دنیای واقعی، حفظ امنیت کودک/درمانگر و جلوگیری از تخریب اتاق بازی ضروری است."], ["ج", "در اتاق بازی هیچ‌گونه حد و مرزی وجود ندارد و کودک مجاز است به درمانگر آسیب بزند یا وسایل اتاق را بشکند."], ["د", "هدف بازی‌درمانی اکسلین، شرطی‌سازی کنشگر با ژتون است."]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل اصول اکسلین (B03 / B17):<\/strong> در بازی‌درمانی غیرمستقیم/کودک‌محور (اکسلین و لندرث)، «بازی، زبان کودک و اسباب‌بازی‌ها، کلمات او هستند». پذیرش بی‌قیدوشرطِ احساسات کودک با <strong>محدودیت‌گذاری درمانی بر رفتارهای خطرناک و تخریبی (به روش $ACT$: به رسمیت شناختن احساس $\\leftarrow$ اعلام محدودیت $\\leftarrow$ هدف‌گذاری جایگزین مقبول)<\/strong> همراه است.<\/li>\n<\/ul>"}, {"n": 92, "section": "روان‌شناسی رشد و تحول، و مداخلات کودک و نوجوان", "booklet": "دفترچه ششم", "q": "پژوهشگری برای بررسی تحول حافظه، سه گروه سنی (۶ ساله‌ها، ۸ ساله‌ها و ۱۰ ساله‌ها) را در سال ۱۴۰۲ انتخاب کرده و هر سه گروه را به مدت ۴ سال متوالی (تا سال ۱۴۰۶) هر ساله مورد سنجش قرار می‌دهد تا هم تفاوت‌های سنی، هم تغییرات درون‌فردی در طول زمان و هم «اثر همگروه یا نسل (Cohort Effect)» را از هم تفکیک کند. این طرح پژوهشی در روان‌شناسی رشد چه نام دارد؟", "opts": [["الف", "طرح مقطعی ساده (Cross-Sectional Design)"], ["ب", "طرح طولی ساده (Longitudinal Design)"], ["ج", "طرح زنجیره‌ای یا متوالی (Sequential Design)"], ["د", "مطالعه موردی (Case Study)"]], "ans": "ج", "exp": "<ul>\n<li><strong>تحلیل روش‌های پژوهش در رشد (B10):<\/strong><ul>\n<li><strong>مقطعی (الف):<\/strong> سریع و کم‌هزینه، اما آسیب‌پذیر در برابر <strong>اثر همگروه (Cohort Effect)<\/strong> و ناتوان در بررسی تغییر فردی.<\/li>\n<li><strong>طولی (ب):<\/strong> بررسی تغییر درون‌فردی یک گروه در طول زمان، اما آسیب‌پذیر در برابر افت آزمودنی‌ها، اثر تمرین و محدود بودن به یک نسل خاص.<\/li>\n<li><strong>زنجیره‌ای / متوالی (ج):<\/strong> ترکیب هوشمندانه طرح طولی و مقطعی که امکان <strong>کشف و کنترل اثر همگروه<\/strong> را فراهم می‌سازد.<\/li>\n<\/ul>\n<\/li>\n<\/ul>"}, {"n": 93, "section": "خانواده‌درمانی، زوج‌درمانی، مشاوره شغلی و مدرسه", "booklet": "دفترچه هفتم", "q": "در یک خانواده، هر زمان که تنش و اختلاف زناشویی پنهان میان زن و شوهر بالا می‌گیرد، فرزند ۱۰ ساله آن‌ها دچار حملات درد شکمی یا افت تحصیلی می‌شود؛ در نتیجه، زن و شوهر اختلاف خود را فراموش کرده و تمام توجه و مکالمات خود را معطوف به مراقبت یا سرزنش فرزند می‌کنند و به این ترتیب، آرامش کاذبی به رابطه زوج برمی‌گردد. در نظریه سیستم‌های خانواده موری بوئن (Murray Bowen) و مینوچین، این فرآیند چه نام دارد؟", "opts": [["الف", "تمایزیافتگی بالای خود (High Differentiation of Self)"], ["ب", "مثلث‌سازی (Triangulation) و انحراف تعارض به سمت «بیمار شناسایی‌شده (Identified Patient - IP)» برای حفظ هموستاز (تعادل) سیستم خانواده"], ["ج", "گسست عاطفی (Emotional Cutoff)"], ["د", "مرزهای واضح و سالم"]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل نقشه سیستمی خانواده (B36 / B37):<\/strong> در دیدگاه سیستمی (بوئن و مینوچین)، زمانی که یک منظومه دو نفره (زن و شوهر) به دلیل <strong>تمایزیافتگی پایین<\/strong> قادر به تحمل و حل اضطراب بین خود نیستند، شخص ثالثی (معمولاً حساس‌ترین فرزند) را به درون تعارض می‌کشند (<strong>مثلث‌سازی / Triangulation<\/strong>). علامتِ کودک (بیمار شناسایی‌شده) در واقع کارکردِ حفظ تعادل و جلوگیری از فروپاشی ازدواج والدین را ایفا می‌کند.<\/li>\n<\/ul>"}, {"n": 94, "section": "خانواده‌درمانی، زوج‌درمانی، مشاوره شغلی و مدرسه", "booklet": "دفترچه هفتم", "q": "در «خانواده‌درمانی ساختاری» سالوادور مینوچین، خانواده‌ای مراجعه کرده‌اند که در آن اعضای خانواده مدام وسط حرف یکدیگر می‌پرند، مادر بدون در زدن وارد اتاق نوجوان می‌شود، به جای فرزندش به سوالات درمانگر پاسخ می‌دهد و کوچک‌ترین ناراحتی یک عضو باعث آشفتگی فوری همه اعضا می‌شود؛ در حالی که پدر کاملاً از خانواده کناره گرفته و بی‌تفاوت است. ساختار مرزها در رابطه مادر-فرزند و رابطه پدر-خانواده به ترتیب چگونه است و کدام تکنیک مینوچین برای به نمایش گذاشتن الگوی تعاملی خانواده در همان جلسه درمان به کار می‌رود؟", "opts": [["الف", "مادر-فرزند: مرز سخت و گسلیده / پدر: مرز درهم‌تنیده — تکنیک تعبیر رویا"], ["ب", "مادر-فرزند: مرز محو و درهم‌تنیده (Enmeshed) / پدر: مرز سخت و گسلیده (Disengaged) — تکنیک نمایش یا بازآفرینی تعامل در جلسه (Enactment) و ترسیم مرز (Boundary Making)"], ["ج", "هر دو: مرز واضح (Clear Boundary) — تکنیک جنوگرام"], ["د", "مادر-فرزند: ائتلاف سالم — تکنیک پرسش معجزه"]], "ans": "ب", "exp": "<ul>\n<li><strong>تحلیل خانواده‌درمانی ساختاری مینوچین (B17 / B36):<\/strong><ul>\n<li>مینوچین مرزها را روی یک پیوستار سه بخشی قرار می‌دهد: ۱. <strong>مرزهای محو / درهم‌تنیده (<code>...<\/code> Enmeshed):<\/strong> حمایت افراطی به قیمت از دست رفتن استقلال و تمایز فردی؛ ۲. <strong>مرزهای واضح (<code>---<\/code> Clear):<\/strong> تعامل سالم همراه با حفظ هویت فردی؛ ۳. <strong>مرزهای سخت / گسلیده (<code>___<\/code> Disengaged):<\/strong> استقلال افراطی به قیمت انزوا و فقدان حمایت عاطفی.<\/li>\n<li>در تکنیک <strong>بازآفرینی / به نمایش گذاشتن (Enactment)<\/strong>، مینوچین به جای گوش دادن به توصیف خانواده درباره مشکلاتشان در خانه، از آن‌ها می‌خواهد که همان بحث را <strong>در حضور او و در لحظه اکنونِ جلسه<\/strong> با یکدیگر انجام دهند تا ساختار معیوب زنده شود و سپس با <strong>مرزگذاری و عدم تعادل‌بخشی<\/strong> آن را تغییر دهد.<\/li>\n<\/ul>\n<\/li>\n<\/ul>"}, {"n": 95, "section": "خانواده‌درمانی، زوج‌درمانی، مشاوره شغلی و مدرسه", "booklet": "دفترچه هفتم", "q": "بر اساس مدل «خانواده‌درمانی تجربه‌ای و ارتباطی ویرجینیا ستیر (Virginia Satir)»، زمانی که یکی از اعضای خانواده در شرایط استرس، احساسات و نیازهای خود را کاملاً نادیده می‌گیرد، تقصیر همه مشکلا const FA = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const KEY = 'rh-exam-120-v1';
let st = {i:0, a:{}, done:false};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.a) st = s; } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} };
const $ = id => document.getElementById(id);
const math = el => { if (window.renderMathInElement) renderMathInElement(el, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false}); };

function render(){
  const q = Q[st.i];
  $('subject').textContent = q.section;
  $('qnum').textContent = 'سؤال ' + FA(q.n);
  $('qtext').innerHTML = q.q;
  const box = $('opts'); box.innerHTML = '';
  q.opts.forEach(([k, t]) => {
    const b = document.createElement('button');
    b.className = 'opt' + (st.a[q.n] === k ? ' sel' : '');
    b.innerHTML = `<span class="k">${k}</span><span>${t}</span>`;
    b.onclick = () => { st.a[q.n] = k; save(); render(); };
    box.appendChild(b);
  });
  $('clear').classList.toggle('hidden', !st.a[q.n]);
  $('prev').disabled = st.i === 0;
  const last = st.i === Q.length - 1;
  $('nextLbl').textContent = last ? 'پایان' : 'بعدی';
  $('next').classList.toggle('finish', last);
  $('next').classList.toggle('primary', !last);
  const ans = Object.keys(st.a).length;
  $('counter').textContent = `${FA(st.i+1)} از ${FA(Q.length)} — پاسخ‌داده: ${FA(ans)}`;
  $('prog').style.width = (ans / Q.length * 100) + '%';
  math($('quiz'));
  window.scrollTo({top:0});
}
function go(i){ st.i = Math.max(0, Math.min(Q.length-1, i)); save(); render(); }
$('prev').onclick = () => go(st.i - 1);
$('next').onclick = () => st.i === Q.length-1 ? finish() : go(st.i + 1);
$('clear').onclick = () => { delete st.a[Q[st.i].n]; save(); render(); };

function openGrid(){
  const w = $('gridWrap'); w.innerHTML = '';
  let sec = null, grid = null;
  Q.forEach((q, idx) => {
    if (q.section !== sec){ sec = q.section;
      const h = document.createElement('div'); h.className='grp'; h.textContent = q.section; w.appendChild(h);
      grid = document.createElement('div'); grid.className='grid'; w.appendChild(grid); }
    const c = document.createElement('button');
    c.className = 'cell' + (st.a[q.n] ? ' done' : '') + (idx === st.i ? ' cur' : '');
    c.textContent = FA(q.n);
    c.onclick = () => { closeGrid(); go(idx); };
    grid.appendChild(c);
  });
  $('modal').classList.add('open');
}
const closeGrid = () => $('modal').classList.remove('open');
$('pick').onclick = openGrid;
$('closeM').onclick = closeGrid;
$('modal').onclick = e => { if (e.target.id === 'modal') closeGrid(); };
$('finishM').onclick = () => { closeGrid(); finish(); };
document.addEventListener('keydown', e => {
  if (st.done || $('modal').classList.contains('open')) { if (e.key==='Escape') closeGrid(); return; }
  if (e.key === 'ArrowLeft') $('next').click();
  if (e.key === 'ArrowRight') $('prev').click();
  const map = {'1':'الف','2':'ب','3':'ج','4':'د'};
  if (map[e.key]) { st.a[Q[st.i].n] = map[e.key]; save(); render(); }
});

function finish(){
  const un = Q.length - Object.keys(st.a).length;
  if (un > 0 && !st.done && !confirm(`${FA(un)} سؤال بی‌پاسخ مانده است. آزمون پایان یابد؟`)) return;
  st.done = true; save(); showResults();
}

function showResults(filter='all'){
  $('quiz').classList.add('hidden'); $('nav').classList.add('hidden');

      <div class="stat" style="--c:var(--bad);--c2:var(--bad-soft)"><b>${FA(bad)}</b><span>غلط</span></div>
      <div class="stat" style="--c:var(--skip);--c2:var(--gold-soft)"><b>${FA(skip)}</b><span>بی‌پاسخ</span></div>

    <div class="verdict">${verdict}<br>درصد با احتساب نمره منفی (هر ۳ غلط = ۱ صحیح): <b>${FA(raw)}٪</b></div>

  });

  html += `</div><h2 class="sec">تحلیل تک‌تک سؤالات</h2>
  <div class="filters">

  </div><div id="list">`;
  Q.forEach(q => {
    const a = st.a[q.n];

    if (filter !== 'all' && filter !== s) return;
    const st_ = {ok:['var(--ok)','var(--ok-soft)','صحیح'], bad:['var(--bad)','var(--bad-soft)','غلط'], skip:['var(--skip)','var(--gold-soft)','بی‌پاسخ']}[s];
    html += `<article class="rv" style="--st:${st_[0]};--st2:${st_[1]}">
      <div class="hd"><b>سؤال ${FA(q.n)} <small style="color:var(--muted);font-weight:500">· ${q.section}</small></b><span class="tag">${st_[2]}</span></div>

    q.opts.forEach(([k,t]) => {

      html += `<li class="${cls}"><b>${k})</b> ${t}${m?`<span class="m">${m}</span>`:''}</li>`;
    });
    html += `</ul><details class="ex" ${s!=='ok'?'open':''}><summary>تحلیل پاسخ (گزینه ${q.ans})</summary><div class="body">${q.exp}</div></details></article>`;
  });
  html += `</div><div class="actions">
    <button class="btn" id="review">بازگشت به سؤالات</button>
    <button class="btn" id="print">چاپ پاسخ‌نامه</button>
    <button class="btn primary" id="restart">شروع دوباره آزمون</button></div>`;
  R.innerHTML = html;
  math(R);
  R.querySelectorAll('.fbtn').forEach(b => b.onclick = () => { showResults(b.dataset.f); document.querySelector('.filters').scrollIntoView(); });
  $('review').onclick = () => { R.classList.add('hidden'); $('quiz').classList.remove('hidden'); $('nav').classList.remove('hidden'); st.done=false; save(); render(); };
  $('print').onclick = () => { R.querySelectorAll('details').forEach(d=>d.open=true); window.print(); };
  $('restart').onclick = () => { if (!confirm('همه پاسخ‌ها پاک شود؟')) return; st = {i:0,a:{},done:false}; save(); location.reload(); };
  if (filter==='all') window.scrollTo({top:0});
}

window.addEventListener('DOMContentLoaded', () => { st.done ? showResults() : render(); });
window.addEventListener('load', () => { st.done ? showResults() : render(); });
</script>
</body>
